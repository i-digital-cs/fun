name: fun_mobile
description: Fun community activity platform — Flutter client.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  go_router: ^15.1.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  intl: any
  equatable: ^2.0.7
  image_picker: ^1.2.3
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  dart_pusher_channels: ^1.3.1
  flutter_svg: ^2.3.0
  http: ^1.6.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/funity-mark.svg
    - assets/branding/funity-app-icon.png
